name: "Broken Link or Error"
description: "Report a broken link, typo, or factual error"
title: "[BUG] "
labels: ["bug", "data-fix"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: "Plan name or section"
      placeholder: "e.g., MiMo Token Plan"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's wrong?
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source / correct link (if applicable)
      placeholder: "https://..."
