name: Check Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: |
            --verbose
            --no-progress
            --timeout 30
            --max-concurrency 5
            --accept 200,201,204,301,302,307,308,429
            --exclude https://x.com/.*
            --exclude https://twitter.com/.*
            --exclude https://education.github.com/.*
            ./README.md ./plans.md ./CONTRIBUTING.md ./plans/*.md
          fail: true
