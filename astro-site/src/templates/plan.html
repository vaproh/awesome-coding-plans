<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Awesome Coding Plans</title>
  <meta name="description" content="{{TITLE}} AI coding plan: {{PRICE}}. Compare models, quota, access, and supported workflows.">
  <link rel="canonical" href="https://awesome-coding-plans.netlify.app/plans/{{SLUG}}/">
  <meta property="og:type" content="article">
  <meta property="og:url" content="https://awesome-coding-plans.netlify.app/plans/{{SLUG}}/">
  <meta property="og:image" content="https://awesome-coding-plans.netlify.app/favicon.svg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://analytics.netlify.com/ns.js"></script>
  <style>
    :root { --bg:#111111; --card:#1e1e1e; --border:#383838; --text:#eeeeee; --muted:#b5b5b5; --dim:#777777; --accent:#bdbdbd; --accent-soft:rgba(189,189,189,.16); --free:#aaaaaa; }
    * { box-sizing:border-box; } html { scroll-behavior:smooth; } body { margin:0; color:var(--text); background:var(--bg); font-family:"Space Grotesk",sans-serif; line-height:1.6; }
    .topbar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:2rem; min-height:68px; padding:0 4vw; background:rgba(17,17,17,.94); border-bottom:1px solid var(--border); backdrop-filter:blur(14px); }
    .brand { color:var(--text); text-decoration:none; font-weight:700; white-space:nowrap; } .prompt { color:var(--accent); font:500 1.2rem "DM Mono",monospace; margin-right:.55rem; }
    nav { display:flex; gap:.3rem; flex:1; } nav a { color:var(--muted); text-decoration:none; padding:.45rem .7rem; font-size:.85rem; } nav a:hover { color:var(--accent); } .nav-meta { display:flex; align-items:center; gap:1rem; color:var(--dim); font:500 .68rem "DM Mono",monospace; white-space:nowrap; } .nav-meta a { color:var(--muted); text-decoration:none; } .nav-meta a:hover { color:var(--accent); } .nav-meta i { display:inline-block; width:6px; height:6px; margin-right:.25rem; border-radius:50%; background:var(--free); }
    main { width:min(900px,92vw); margin:auto; padding:3rem 0 5rem; } .detail-head { border-bottom:1px solid var(--border); padding-bottom:1.5rem; margin-bottom:2rem; }
    h1 { margin:0 0 .8rem; font-size:clamp(2rem,5vw,3.2rem); line-height:1.1; } h2 { margin:2.5rem 0 1rem; } h3 { margin:1.5rem 0 .6rem; } p { color:var(--muted); }
    a { color:var(--accent); } .badges { display:flex; gap:.45rem; flex-wrap:wrap; } .badge { display:inline-block; padding:.25rem .6rem; border-radius:999px; background:var(--accent-soft); color:var(--accent); font:500 .72rem "DM Mono",monospace; } .badge.orange { color:#999999; background:rgba(153,153,153,.13); }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; margin:2rem 0; } .meta-item { padding:1rem; background:var(--card); border:1px solid var(--border); border-radius:8px; } .meta-label { display:block; color:var(--dim); font:500 .68rem "DM Mono",monospace; text-transform:uppercase; letter-spacing:.08em; } .meta-value { display:block; margin-top:.25rem; font-weight:600; }
    .content { font-size:1rem; } .content ul { padding-left:1.4rem; } .content li { margin:.35rem 0; } table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.9rem; overflow:hidden; } th,td { padding:.7rem; text-align:left; border-bottom:1px solid var(--border); } th { color:var(--muted); font:500 .7rem "DM Mono",monospace; text-transform:uppercase; } blockquote { margin:1rem 0; padding:.8rem 1rem; border-left:2px solid var(--accent); background:var(--card); color:var(--muted); }
    @media (max-width:650px) { .topbar { flex-wrap:wrap; gap:.7rem; padding:.75rem 4vw; } nav { flex-basis:100%; order:3; } main { padding-top:2rem; } table { display:block; overflow-x:auto; white-space:nowrap; } }
  </style>
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><span class="prompt">&gt;_</span>CodingPlans</a><nav aria-label="Primary navigation"><a href="/">Catalog</a><a href="/comparison">Compare</a><a href="/student-discounts">Students</a><a href="/faq">FAQ</a></nav><div class="nav-meta"><span><i></i> 30 plans</span><a href="/plans.json">JSON</a><a href="https://github.com/vaproh/awesome-coding-plans">GitHub ↗</a></div></header>
  <main><article><header class="detail-head"><h1>{{TITLE}}</h1><div class="badges"><span class="badge">{{TYPE}}</span><span class="badge">{{PRICE_RANGE}}</span><span class="badge">{{MODEL_ACCESS}}</span><a class="badge" href="{{WEBSITE}}" target="_blank" rel="noopener noreferrer">Official site ↗</a></div></header><div class="meta"><div class="meta-item"><span class="meta-label">Price</span><span class="meta-value">{{PRICE}}</span></div><div class="meta-item"><span class="meta-label">Quota</span><span class="meta-value">{{QUOTA}}</span></div><div class="meta-item"><span class="meta-label">Quota model</span><span class="meta-value">{{QUOTA_MODEL}}</span></div><div class="meta-item"><span class="meta-label">Best for</span><span class="meta-value">{{BEST_FOR}}</span></div></div><div class="badges">{{TAGS}}</div><div class="content">{{CONTENT}}</div></article></main>
  <footer class="site-footer"><span>Awesome Coding Plans · verified September 3, 2026</span><span><a href="/llms.txt">For agents</a> · <a href="https://github.com/vaproh/awesome-coding-plans">Source</a></span></footer>
</body>
</html>
