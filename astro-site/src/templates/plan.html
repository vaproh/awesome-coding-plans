<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} | Awesome Coding Plans</title>
  <script defer src="https://analytics.netlify.com/ns.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #111114;
      --bg-card: #16161a;
      --bg-card-hover: #1c1c22;
      --border: #2a2a32;
      --border-light: #3a3a44;
      --text: #f0f0f2;
      --text-muted: #8b8b96;
      --text-dim: #5a5a66;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.15);
      --green: #22c55e;
      --green-glow: rgba(34, 197, 94, 0.15);
      --orange: #f59e0b;
      --red: #ef4444;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 280px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      position: fixed;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .sidebar-brand { margin-bottom: 1.5rem; }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }
    .brand-icon { font-size: 1.5rem; animation: pulse 2s ease-in-out infinite; }
    .brand-text { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
    .sidenav { display: flex; flex-direction: column; gap: 0.125rem; flex: 1; }
    .sidenav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all var(--transition);
      border: 1px solid transparent;
    }
    .sidenav a:hover {
      background: var(--bg-card);
      color: var(--text);
      border-color: var(--border);
    }
    .sidenav a.active {
      background: var(--accent-glow);
      color: var(--accent-light);
      border-color: var(--accent);
    }
    .sidebar-footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .main {
      margin-left: 280px;
      padding: 2.5rem 3rem;
      max-width: 900px;
    }

    /* Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typography */
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
      line-height: 1.1;
    }
    h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 2rem 0 1rem;
    }
    h3 {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 1.5rem 0 0.75rem;
    }
    p { margin-bottom: 1rem; color: var(--text-muted); }
    a { color: var(--accent-light); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--accent); }

    /* Tables */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 1rem 0;
      font-size: 0.85rem;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    th, td { padding: 0.75rem 1rem; text-align: left; }
    th {
      font-weight: 600;
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border);
    }
    td { border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: var(--bg-card); }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-free { background: var(--green-glow); color: var(--green); }
    .badge-paid { background: var(--accent-glow); color: var(--accent-light); }

    /* Plan detail */
    .plan-detail { animation: fadeInUp 0.4s ease-out; }
    .plan-detail-header {
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .plan-badges {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .badge-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--accent-glow);
      color: var(--accent-light);
      border: 1px solid var(--accent);
      transition: all var(--transition);
    }
    .badge-link:hover { background: var(--accent); color: white; }
    .plan-meta {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .meta-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
    }
    .meta-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-dim);
      margin-bottom: 0.25rem;
    }
    .meta-value { font-weight: 600; font-size: 0.9rem; }
    .plan-content { line-height: 1.7; }
    .plan-content ul { margin-left: 1.25rem; }
    .plan-content li { margin-bottom: 0.35rem; }
    .plan-content blockquote {
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      padding: 1rem;
      border-left: 3px solid var(--accent);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1.5rem; }
      h1 { font-size: 1.5rem; }
      .plan-meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <sidebar class="sidebar">
      <div class="sidebar-brand">
        <a href="/" class="brand">
          <span class="brand-icon">⚡</span>
          <span class="brand-text">CodingPlans</span>
        </a>
      </div>
      <nav class="sidenav">
        {{NAV}}
      </nav>
      <div class="sidebar-footer">
        <span>Updated Sep 3, 2026</span>
      </div>
    </sidebar>
    <main class="main">
      <article class="plan-detail">
        <div class="plan-detail-header">
          <h1>{{TITLE}}</h1>
          <div class="plan-badges">
            <a href="{{WEBSITE}}" target="_blank" rel="noopener noreferrer" class="badge-link">Website →</a>
          </div>
        </div>
        <div class="plan-content">
          {{CONTENT}}
        </div>
      </article>
    </main>
  </div>
</body>
</html>
